name: Validate review sample projects

on:
  push:
    paths:
      - "test-repos/**"
      - ".github/workflows/review-samples.yml"
  pull_request:
    paths:
      - "test-repos/**"
      - ".github/workflows/review-samples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check portable setup and intentional regression controls
        run: node --test test-repos/tests/prepare.test.mjs
